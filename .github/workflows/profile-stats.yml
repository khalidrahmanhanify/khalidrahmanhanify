name: Update Profile Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&title_color=e4e6eb&icon_color=00FFAA&hide_border=true&bg_color=16161c&border_radius=15
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=dark&hide_border=true&bg_color=16161c&border_radius=15
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate NoteX Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=NoteX&theme=dark&hide_border=true&border_color=00FFAA&description_lines_count=1
          path: profile/pin-NoteX.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Panaah Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=panaah&theme=dark&hide_border=true&border_color=00FFAA&description_lines_count=1
          path: profile/pin-panaah.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Profile Viewer Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=profile-viewer&theme=dark&hide_border=true&border_color=00FFAA&description_lines_count=1
          path: profile/pin-profile-viewer.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Chatbot Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=chatbot&theme=dark&hide_border=true&border_color=00FFAA&description_lines_count=1
          path: profile/pin-chatbot.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Resume Generator Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=resume-generator&theme=dark&hide_border=true&border_color=00FFAA&description_lines_count=1
          path: profile/pin-resume-generator.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Guess My Number Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=guess-my-number-v2&theme=dark&hide_border=true&border_color=00FFAA&description_lines_count=1
          path: profile/pin-guess-my-number-v2.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Generated Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update profile statistics"

          git push
